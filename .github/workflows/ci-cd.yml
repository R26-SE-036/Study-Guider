# Test every push; deploy what reaches main to the AWS server.
#
#   push / pull request to dev or main  ->  tests
#   push to main (after the tests pass) ->  build the arm64 image, push it to
#                                           ECR, and roll study-guider on the
#                                           EC2 host
#
# AWS access is an access key for the codeguru-github-deploy IAM user, kept in
# the secrets of the "production" environment. That environment accepts only
# the main branch, so a run on any other branch cannot read the key. (The AWS
# account's organisation policy blocks the OpenID Connect provider this used
# before.) The user may push to the codeguru/* image repositories and, on the
# host, run one thing - the codeguru-deploy SSM document, which takes a service
# name and a commit SHA and nothing else.
#
# The graph itself is not deployed from here. Re-running
# app.dev_tools.index_knowledge_base is a deliberate step after data/*.txt
# changes, because every run spends one Gemini embedding call per chunk.
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

jobs:
  test:
    name: Test - backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The service refuses to start with NEO4J_URI unset - a misconfiguration -
    # but starts degraded when it is set and unreachable, which is an outage.
    # The tests stub the database, so an address with nothing behind it is all
    # they need, and no credential ever reaches CI.
    env:
      NEO4J_URI: neo4j://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: unused-in-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider

  build:
    name: Build study-guider
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The server is arm64 (t4g), so the image is built on an arm64 runner
    # rather than emulated.
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/codeguru/study-guider:${{ github.sha }}
          cache-from: type=gha,scope=study-guider
          cache-to: type=gha,mode=max,scope=study-guider

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-study-guider
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll the service on the server
        run: |
          service=study-guider
          id=$(aws ssm send-command --document-name codeguru-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "{\"service\":[\"$service\"],\"tag\":[\"$GITHUB_SHA\"]}" \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          if [ "$status" != Success ]; then
            echo "::error::$service was not deployed ($status); the server kept the previous image"
            exit 1
          fi
